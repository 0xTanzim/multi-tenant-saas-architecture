version: "3.9"

services:
  # PostgreSQL Database with PostGIS for geospatial queries
  postgres:
    image: postgis/postgis:latest
    container_name: donebyme_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-donebyme_booking}
      POSTGRES_USER: ${DATABASE_USERNAME:-donebyme_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-donebyme_pass_2025}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro,z
    networks:
      - donebyme_network
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME:-donebyme_user} -d ${DATABASE_NAME:-donebyme_booking}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # pgAdmin for database management (optional, for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: donebyme_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@donebyme.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - donebyme_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    shm_size: 512m
    depends_on:
      postgres:
        condition: service_healthy
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1

  # Redis for caching and sessions
  redis:
    image: redis:8.2-alpine
    container_name: donebyme_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - donebyme_network
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 512m
    cpus: 0.5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass_2025}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (NestJS)
  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
      args:
        NODE_ENV: development
    container_name: donebyme_api
    environment:
      # Node
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Server
      PORT: 8444
      HOST: 0.0.0.0

      # Database
      DATABASE_URL: postgresql://${DATABASE_USERNAME:-donebyme_user}:${DATABASE_PASSWORD:-donebyme_pass_2025}@postgres:5432/${DATABASE_NAME:-donebyme_booking}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-donebyme_booking}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-donebyme_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-donebyme_pass_2025}
      DATABASE_SSL: "false"

      # Cache
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2025}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2025}
      CACHE_TTL: 3600

      # JWT & Auth
      JWT_SECRET: ${JWT_SECRET:-your-dev-jwt-secret-change-in-prod}
      JWT_EXPIRY: 1h
      JWT_REFRESH_EXPIRY: 7d

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}

      # Stripe (development keys)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dev}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dev}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev}

      # Google OAuth
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}

      # AWS
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-donebyme-uploads-dev}

      # Email (AWS SES)
      MAIL_HOST: ${MAIL_HOST:-email-smtp.us-east-1.amazonaws.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@donebyme.com}

      # Feature Flags
      FEATURE_PAYMENTS: ${FEATURE_PAYMENTS:-true}
      FEATURE_LOYALTY: ${FEATURE_LOYALTY:-true}
      FEATURE_STAFF_MANAGEMENT: ${FEATURE_STAFF_MANAGEMENT:-true}

    ports:
      - "8444:8444"
    volumes:
      - ../../apps/api/src:/app/apps/api/src:cached
      - ../../packages:/app/packages:cached
      - /app/node_modules
      - /app/apps/api/dist
    networks:
      - donebyme_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8444/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend (Next.js)
  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        NODE_ENV: development
    container_name: donebyme_web
    environment:
      # Node
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001

      # API
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8444}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}

      # Feature Flags
      NEXT_PUBLIC_FEATURE_PAYMENTS: ${FEATURE_PAYMENTS:-true}
      NEXT_PUBLIC_FEATURE_LOYALTY: ${FEATURE_LOYALTY:-true}
      NEXT_PUBLIC_FEATURE_STAFF_MANAGEMENT: ${FEATURE_STAFF_MANAGEMENT:-true}

      # Analytics (optional)
      NEXT_PUBLIC_GTAG_ID: ${NEXT_PUBLIC_GTAG_ID:-}

    ports:
      - "3001:3001"
    volumes:
      - ../../apps/web/src:/app/apps/web/src:cached
      - ../../packages:/app/packages:cached
      - ../../apps/web/.next:/app/apps/web/.next
      - /app/node_modules
    networks:
      - donebyme_network
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Nginx Reverse Proxy (optional, for production-like setup)
  nginx:
    image: nginx:latest
    container_name: donebyme_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - donebyme_network
    depends_on:
      - api
      - web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

networks:
  donebyme_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
